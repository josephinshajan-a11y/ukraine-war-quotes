[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotebase"
version = "1.0.0"
description = "Collects and verifies media quotes on Russia's war on Ukraine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.0"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
quotebase = "quotebase.cli:main"

[tool.setuptools]
packages = ["quotebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
